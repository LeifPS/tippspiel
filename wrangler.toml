name = "tippspiel"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tippspiel"
database_id = "d33722fb-62e4-473b-9acf-3b0a2bc45623"

[triggers]
# Jede Minute: der Scheduler entscheidet selbst, welche API-Aufrufe fällig sind
crons = ["* * * * *"]

# Secret (nicht in dieser Datei!): FOOTBALL_DATA_TOKEN
